<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study books</title>
<script>try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
<style>
/* Dark editorial poster look (the person's references: grain, halftone, soft blurred light, bold + light type).
   Every effect is a static background drawn once: no filters, no blur(), no animation except the small spinner. */
:root {
  color-scheme: dark;
  --bg: #0b0b0b; --panel: rgba(20,20,20,.68); --ink: #ececea; --muted: #a3a3a0; --line: #2e2e2e; --hair: #222222;
  --accent: #ececea; --accent-ink: #0b0b0b; --accent-soft: #1b1b1b; --ok: #62d394; --warn: #e3aa55; --bad: #ff6f62;
  --bg0: #101010; --pillbg: rgba(11,11,11,.7); --dlg: #141414; --dot: rgba(236,236,234,.10); --line2: #4a4a4a;
  --ph: #8a8a87; --ul: #6a6a6a; --shade: rgba(0,0,0,.7);
  --radius: 0;
  --sans: "Helvetica Neue", "Segoe UI", Roboto, "Noto Sans", Arial, system-ui, sans-serif;   /* Segoe/Roboto have a real light weight, Arial has not */
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
/* light theme: the same layout, paper-white page; the poster stays a printed poster in both */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f0ec; --panel: rgba(255,255,255,.72); --ink: #161616; --muted: #5f5f5b; --line: #cdcbc4; --hair: #e0ded8;
  --accent: #161616; --accent-ink: #f1f0ec; --accent-soft: #e6e4de; --ok: #17744a; --warn: #8f5a00; --bad: #c1291a;
  --bg0: #ecebe6; --pillbg: rgba(255,255,255,.7); --dlg: #fbfaf7; --dot: rgba(22,22,22,.10); --line2: #a9a7a0;
  --ph: #85857f; --ul: #8f8d86; --shade: rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
html { overflow-x: clip; background: var(--bg); }
/* the page background is #bg: one canvas drawn once for the screen (see paintTextures), fixed behind everything,
   so there is no tile to repeat and scrolling never repaints it */
body { margin: 0; background: transparent; color: var(--ink); font: 15px/1.55 var(--sans); }
#bg { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100lvh; z-index: -1; pointer-events: none; background: var(--bg0); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---- header: a poster (the person's reference): grey paper, inked squares, the short name knocked out of them
   in big letters cut by the square edges, a small text column. Paper and ink are canvases drawn once (paintTextures). ---- */
header { max-width: 980px; margin: 0 auto; padding: 22px 16px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.poster { position: relative; flex: 1 1 100%; margin-bottom: 8px; padding: clamp(14px, 3.2vw, 34px); color: #161616; background: #b9bcbf; }
.poster > canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.pgrid { position: relative; }
.pgrid { --cs: min(158px, calc((100vw - 32px - 2 * clamp(14px, 3.2vw, 34px) - 12px) / 4));
  display: grid; grid-template-columns: repeat(4, var(--cs)); grid-auto-rows: var(--cs); gap: 3px; }
.cell { position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.55); }
.cell.part { box-shadow: none; }
.cell canvas { position: absolute; left: 0; width: 100%; top: var(--cut, 0%); height: calc(100% - var(--cut, 0%)); background: #1d1d1d; }
.cell b { position: absolute; left: var(--x, 0); top: var(--y, 0); font: 900 calc(var(--cs) * 1.32)/.78 "Arial Black", "Segoe UI Black", "Helvetica Neue", Arial, sans-serif;
  color: #b9bcbf; letter-spacing: 0; }
.pnote { align-self: end; justify-self: start; width: min(300px, 46vw); font: 11px/1.35 var(--sans); color: #1e1e1e; display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; padding: 0 0 2px 8px; }
.pnote p { margin: 0; }
.pnote .pfull { font-weight: 600; }
@media (max-width: 560px) { .pnote { width: auto; grid-template-columns: 1fr; font-size: 9.5px; gap: 4px; } }

.pill { font: 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 0;
  border: 1px solid var(--line); color: var(--muted); background: var(--pillbg); }
.pill.busy { color: var(--ink); border-color: var(--ink); }
.pill.bad { color: var(--bad); border-color: var(--bad); }
.pill.ok { color: var(--ok); border-color: var(--ok); }
nav { max-width: 980px; margin: 0 auto; padding: 0 16px; display: flex; gap: 22px; border-bottom: 1px solid var(--line);
  overflow-x: auto; scrollbar-width: none; }
nav button { flex: none; background: none; border: 0; font: 400 16px var(--sans); text-transform: lowercase; color: var(--muted);
  padding: 12px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; cursor: pointer; }
nav button:hover { color: var(--ink); }
nav button.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
main { max-width: 980px; margin: 0 auto; padding: 22px 16px 70px; }
section.tab { display: none; } section.tab.on { display: block; }

/* ---- surfaces ---- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
.drop { border: 1px dashed var(--line2); border-radius: var(--radius); padding: 30px 16px; text-align: center; cursor: pointer;
  background: radial-gradient(circle, var(--dot) 0 1px, transparent 1.5px) 0 0 / 6px 6px, var(--bg); }
.drop.over { border-style: solid; border-color: var(--ink); background-color: var(--accent-soft); }
.drop strong { display: block; font: 700 19px var(--sans); letter-spacing: -.02em; margin-bottom: 4px; }
.drop span { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: 600 14px var(--sans); border: 1px solid var(--ink); background: transparent; color: var(--ink);
  padding: 7px 14px; border-radius: 0; cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: transparent; color: var(--ink); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible, nav button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
label.f { display: block; font: 12px var(--mono); letter-spacing: .02em; color: var(--muted); margin: 14px 0 5px; }
select, textarea, input[type=text], input[type=password], input[type=date] { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 0; padding: 8px 10px; }
select:hover, textarea:hover, input:hover { border-color: var(--line2); }
textarea { min-height: 64px; resize: vertical; }
::placeholder { color: var(--ph); opacity: 1; }
input[type=date] { width: auto; min-width: 11em; }
.list input[type=date] { padding: 3px 8px; font-size: 13px; flex: none; }
.day { margin-top: 10px; } .day > strong { font-size: 14px; }
/* interactive page button: fake refraction of a glass lens, drawn with static gradients and shadows only (no filter):
   a bright rim that bends round the edge, a highlight on top, red/blue fringes at the sides of the edge and of the text */
ul.list li.ipg { align-items: center; padding: 12px 0; }
.ipg .ipt { flex: 1 1 0; min-width: 8em; }
.ipg .ipb { flex: none; display: inline-flex; gap: 6px; }
.ipe { flex: 1 0 100%; }
.ipe textarea { min-height: 76px; }
.ipe .row { margin-top: 8px; }
.gbtn > a:not(.btn) { text-decoration: none; color: var(--bt); }
/* the button is a pill of reeded glass seen from the side: thin horizontal ribs of uneven width, fine grain, a bright
   side and a dark side, a lit rim, a glare. Each button gets its own --p (rib phase), --r (rib size), --b (where it is
   brightest) and --dir (which side), set from its name, so no two look the same. Across the middle a black band with
   blurred edges carries the text; the light theme is the same picture with the colours inverted.
   --gl1 / --gl2: light and dark colour of the glass (r, g, b); --c0..--c3: its base from dark to bright. */
:root { --gl1: 255,255,255; --gl2: 0,0,0; --c0: #181818; --c1: #444; --c2: #8c8c8c; --c3: #f6f6f6; --band: #050505; --bt: #fff; }
:root[data-theme="light"] { --gl1: 0,0,0; --gl2: 255,255,255; --c0: #e8e8e8; --c1: #b9b9b9; --c2: #727272; --c3: #0b0b0b; --band: #f8f8f5; --bt: #0b0b0b; }
/* the shape: one rectangle at least 34 px high, square corners (title up to two lines, then the "change" end of the same glass); drawn as a mask of gradients on the
   texture, so title and end share it without a seam */
.gbtn { --p0: 0px; --r: 1; --b0: 85%; --dir: 90deg; --b: var(--b0); --q: var(--b0); --p: var(--p0);
  --shape-img: linear-gradient(#000, #000); --shape-size: 100% 100%; --shape-pos: 0 0;
  position: relative; display: inline-flex; align-items: center; flex: 0 1 auto; max-width: 100%; min-height: 34px;
  isolation: isolate; color: var(--bt); font: 600 14px var(--sans); }
.gbtn::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle, rgba(var(--gl1), .22) 0 .55px, transparent .85px) 0 0 / 2.6px 2.6px,
    repeating-linear-gradient(180deg, rgba(var(--gl1), .6) 0, rgba(var(--gl1), .08) calc(var(--r) * 1.2px), rgba(var(--gl2), .5) calc(var(--r) * 3px),
      rgba(var(--gl2), 0) calc(var(--r) * 4.4px), rgba(var(--gl1), .2) calc(var(--r) * 5.5px)) 0 var(--p),
    repeating-linear-gradient(180deg, rgba(var(--gl2), 0) 0, rgba(var(--gl1), .45) calc(var(--r) * 2.4px), rgba(var(--gl2), .6) calc(var(--r) * 4.6px),
      rgba(var(--gl2), 0) calc(var(--r) * 7.3px), rgba(var(--gl1), .1) calc(var(--r) * 9px)) 0 calc(var(--p) * -1.3),
    linear-gradient(90deg, rgba(var(--gl1), 0) calc(var(--q) - 24%), rgba(var(--gl1), .3) var(--q), rgba(var(--gl1), 0) calc(var(--q) + 24%)),
    linear-gradient(90deg, var(--c0) calc(var(--b) - 55%), var(--c1) calc(var(--b) - 28%), var(--c2) calc(var(--b) - 12%), var(--c3) var(--b),
      var(--c2) calc(var(--b) + 12%), var(--c1) calc(var(--b) + 28%), var(--c0) calc(var(--b) + 55%));
  -webkit-mask-image: var(--shape-img); mask-image: var(--shape-img); -webkit-mask-size: var(--shape-size); mask-size: var(--shape-size);
  -webkit-mask-position: var(--shape-pos); mask-position: var(--shape-pos); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
/* a thin outline along the edge: no glass texture, a plain line that is lit where the light zones of the glass are (--b, --q) */
.gring { position: absolute; inset: 0; z-index: 1; pointer-events: none; border-radius: 0; padding: 1.5px;
  background:
    linear-gradient(90deg, rgba(var(--gl1), 0) calc(var(--b) - 22%), rgba(var(--gl1), 1) var(--b), rgba(var(--gl1), 0) calc(var(--b) + 22%)),
    linear-gradient(90deg, rgba(var(--gl1), 0) calc(var(--q) - 18%), rgba(var(--gl1), .6) var(--q), rgba(var(--gl1), 0) calc(var(--q) + 18%)),
    rgba(var(--gl1), .16);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.gbtn::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  -webkit-mask-image: var(--shape-img); mask-image: var(--shape-img); -webkit-mask-size: var(--shape-size); mask-size: var(--shape-size);
  -webkit-mask-position: var(--shape-pos); mask-position: var(--shape-pos); -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  background: linear-gradient(180deg, rgba(var(--gl1), .5), rgba(var(--gl1), 0) 22%),
    linear-gradient(112deg, rgba(var(--gl1), 0) 28%, rgba(var(--gl1), .26) 40%, rgba(var(--gl1), 0) 52%),
    linear-gradient(0deg, rgba(var(--gl1), .22), rgba(var(--gl1), 0) 16%); }
a.glass > span, .gedit > span { position: relative; z-index: 1; isolation: isolate; display: block; padding: 2px 16px; }
a.glass > span::before, .gedit > span::before { content: ""; position: absolute; inset: -4px -7px; z-index: -1; border-radius: 0; background: var(--band);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent), linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent), linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent);
  mask-composite: intersect; }
/* hover: the light zone of the texture itself flows out to the sides and back (a second, weaker band goes the other way) and
   the ribs creep up (the three numbers are registered so the browser can animate them) */
@property --b { syntax: "<percentage>"; inherits: true; initial-value: 85%; }
@property --q { syntax: "<percentage>"; inherits: true; initial-value: 30%; }
@property --p { syntax: "<length>"; inherits: true; initial-value: 0px; }
/* the movement itself is driven from the script below (glassIn / glassOut): the same loop, but it is never cut: on leaving it
   runs on to its end (where the glass is at rest) a little faster, and a quick in-and-out never jumps */
a.glass { display: flex; align-items: center; justify-content: center; flex: 1 1 auto; min-width: 0; min-height: 34px; padding: 6px 6px 6px 18px; }
a.glass > span { min-width: 0; max-width: 100%; }
a.glass > span > i { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; font-style: normal; overflow: hidden; line-height: 1.3; text-align: center; overflow-wrap: anywhere; }
.gedit { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; flex: none; align-self: stretch; margin: 0; padding: 0 14px 0 4px; border: 0; background: none;
  color: var(--bt); cursor: pointer; font: 600 12px var(--sans); }
.gedit > span { padding: 1px 14px; }
.gedit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.gbtn > a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }   /* .btn sets display, which would show a hidden button */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 0; overflow: hidden; }
.seg label { padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); font-weight: 600; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
.file { position: relative; border: 1px solid var(--line); border-radius: 0; overflow: hidden; background: var(--bg);
  aspect-ratio: 3/4; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted);
  text-align: center; padding: 4px; word-break: break-all; }
.file img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.file button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 0; border: 0;
  background: #000; color: #fff; cursor: pointer; line-height: 22px; padding: 0; font-size: 14px; }
.x { background: none; border: 0; padding: 0 3px; margin-left: 1px; color: var(--muted); font: 12px var(--mono); cursor: pointer; }
.x:hover { color: var(--bad); }
.x:disabled { opacity: .45; cursor: default; }
.file .n { position: absolute; left: 3px; top: 3px; background: #000; color: #fff; border-radius: 0; padding: 0 5px; }
.bar { height: 4px; background: var(--hair); border-radius: 0; overflow: hidden; margin-top: 12px; display: none; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); }
.msg { margin-top: 10px; font-size: 14px; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
h2 { font: 300 clamp(24px, 3.6vw, 34px)/1.05 var(--sans); letter-spacing: -.03em; text-transform: lowercase; margin: 34px 0 14px; color: var(--ink); }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { padding: 10px 0; border-top: 1px solid var(--hair); font-size: 14px; display: flex; gap: 10px;
  justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
ul.list li:first-child { border-top: 0; }
.muted { color: var(--muted); } .small { font-size: 13px; } .bad { color: var(--bad); } .warn { color: var(--warn); }
.subj h3 { margin: 0; font: 700 clamp(19px, 2.6vw, 24px)/1.15 var(--sans); letter-spacing: -.025em; }
.subj .code { color: var(--muted); font: 12px var(--mono); margin-left: 8px; vertical-align: middle; }
.subj .meta { color: var(--muted); font: 12px var(--mono); margin: 6px 0 14px; }
.subj details { margin-top: 12px; font-size: 14px; }
.subj summary { cursor: pointer; color: var(--muted); }
.subj summary:hover { color: var(--ink); }
.act { display: inline-flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--ink); }
.act i { flex: none; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line);
  border-top-color: var(--ink); animation: sbspin .8s linear infinite; }
.act.wait { color: var(--muted); }
.act.wait i { border: 0; width: 7px; height: 7px; margin: 3px; background: var(--muted); animation: sbpulse 1.6s ease-in-out infinite; }
.autoact { margin-bottom: 14px; }
@keyframes sbspin { to { transform: rotate(360deg); } }
@keyframes sbpulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .act i, .act.wait i { animation: none; } }
.topics { columns: 2 260px; margin: 8px 0 0; padding-left: 18px; }
.topics li { break-inside: avoid; } .topics .zero { color: var(--muted); }
.empty { color: var(--muted); padding: 22px 0; text-align: center; font: italic 300 16px var(--sans); }
.notice { border: 1px solid var(--line); border-left: 3px solid var(--warn); padding: 10px 12px; background: var(--panel); border-radius: 0; margin-bottom: 12px; font-size: 14px; }
.grow { flex: 1; }
dialog { border: 1px solid var(--line); border-radius: 0; background: var(--dlg); color: var(--ink);
  max-width: 520px; width: calc(100% - 32px); padding: 22px; }
dialog::backdrop { background: var(--shade); }
dialog h3 { margin: 0 0 12px; font: 300 26px/1.1 var(--sans); letter-spacing: -.03em; text-transform: lowercase; }
dialog ol { padding-left: 20px; margin: 8px 0; } dialog li { margin: 6px 0; }
.dlg-x { position: absolute; right: 12px; top: 12px; margin: 0; }
dialog { position: relative; }
code { background: var(--accent-soft); padding: 1px 5px; border-radius: 0; font: 13px var(--mono); }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; margin-top: 12px; }
.chk input { margin-top: 4px; accent-color: var(--ink); }
.sug { padding: 11px 0; border-top: 1px solid var(--hair); font-size: 14px; }
.sug:first-child { border-top: 0; }
.sug .q { white-space: pre-wrap; color: var(--muted); font-size: 13px; margin: 4px 0; font-style: italic; }
.tag { font: 11px var(--mono); padding: 1px 7px; border-radius: 0; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; }
.tag.ok { color: var(--ok); border-color: var(--ok); } .tag.bad { color: var(--bad); border-color: var(--bad); }
.tag.wait { color: var(--ink); border-color: var(--ink); }
pre.diff { margin: 8px 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 0;
  font: 12px/1.45 var(--mono); max-height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
pre.diff .a { color: var(--ok); } pre.diff .r { color: var(--bad); } pre.diff .h { color: var(--muted); }
.langsw { display: inline-flex; border: 1px solid var(--line); border-radius: 0; overflow: hidden; }
.langsw button { background: var(--pillbg); border: 0; color: var(--muted); font: 12px var(--mono); padding: 4px 9px; cursor: pointer; }
.langsw button.on { background: var(--ink); color: var(--bg); }
a:not(.btn) { color: var(--ink); text-decoration: underline; text-decoration-color: var(--ul); text-underline-offset: 3px; }
a:not(.btn):hover { text-decoration-color: var(--ink); }
#auth { width: min(420px, 94vw); }
#auth input[type=text], #auth input[type=password] { width: 100%; }
#turnstile { margin-top: 12px; }
.row.wrap { flex-wrap: wrap; gap: 6px; }
.prog { flex-basis: 100%; margin-top: 6px; font: 12px/1.5 var(--mono); color: var(--ink); }
.prog .pb { height: 3px; background: var(--hair); margin: 4px 0; max-width: 360px; }
.prog .pb i { display: block; height: 100%; background: var(--ink); }
.prog .pf { color: var(--muted); word-break: break-word; }
.who { font: 11px var(--mono); color: var(--muted); }
.ev { padding: 8px 0; border-top: 1px solid var(--hair); font-size: 13px; }
.ev:first-child { border-top: 0; }
.ev .lv { font: 11px var(--mono); margin-right: 6px; }
.ev .lv.act { color: var(--ok); } .ev .lv.warn { color: var(--warn); } .ev .lv.info { color: var(--muted); }
pre.skill { max-height: 360px; overflow: auto; white-space: pre-wrap; font: 12px/1.45 var(--mono); background: var(--bg);
  border: 1px solid var(--line); padding: 8px 10px; margin: 8px 0; }
.engwrap { display: inline-flex; flex-direction: column; align-items: stretch; gap: 5px; }
.usage { display: grid; grid-template-columns: auto minmax(46px, 1fr) auto; gap: 2px 7px; align-items: center; font: 11px/1.2 var(--mono); color: var(--muted); }
.usage:empty { display: none; }
.usage .t { height: 3px; border-radius: 0; background: var(--line); overflow: hidden; }
.usage .t b { display: block; height: 100%; background: var(--ink); border-radius: 0; }
.usage .w b { background: var(--warn); } .usage .x b { background: var(--bad); }
.usage .x.p, .usage .x.l { color: var(--bad); }
.usage .note { grid-column: 1 / -1; }
input[type=number] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 8px 10px; width: 100%; }
.exdays { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 14px; margin-top: 8px; }
.exdays label { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.exdays input { margin-top: 3px; accent-color: var(--ink); }
.exrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.exset { padding: 12px 0; border-top: 1px solid var(--hair); font-size: 14px; }
.exset:first-child { border-top: 0; }
.drawn { margin-top: 10px; padding: 10px 12px; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 0; }
@media (max-width: 560px) {
  header { min-height: 240px; padding-top: 40px; }
  h1 span { margin-left: .5em; }
  nav { gap: 16px; }
  .exrow { grid-template-columns: 1fr; }
}

  ["sug.h", "Запропонувати доповнення до сторінки", "Suggest an addition to a page"],
  ["sug.intro", "Кожен у своєму просторі може запропонувати доповнення чи виправлення до окремого запису книги або до інтерактивної сторінки. Claude перевірить пропозицію за підручниками й сам вирішить, чи вносити її. Зміну можна скасувати. Якщо погодишся, прийнята зміна піде ще й адміну на розгляд для основної книги.<br>Захист від зловживань: до 5 пропозицій на добу й не більше 3 одночасно, до 1500 символів. Текст пропозиції ніколи не виконується як команда. Кожна зміна проходить автоматичні перевірки: тільки невеликі правки, без посилань, скриптів і зовнішніх ресурсів.",
    "Everyone, in their own space, can suggest an addition or a correction to a single book entry or to an interactive page. Claude checks the suggestion against the textbooks and decides by itself whether to apply it. A change can be undone. If you agree, an accepted change also goes to the admin for the main book.<br>Protection against abuse: up to 5 suggestions a day and no more than 3 at a time, up to 1500 characters. The text of a suggestion is never run as a command. Every change goes through automatic checks: only small edits, no links, scripts or external resources."],

  ["sk.h", "Скіл для моделей", "Skill for the models"],
  ["sk.intro", "Правила, які отримує кожен виклик моделі в кожного учасника, і новий теж (Claude чи OpenRouter): загальна частина + розділ свого етапу. Opus навчається на реальних результатах і переписує їх, щоб Sonnet і Haiku додавали матеріал якісно. Одна сесія навчання — не більше 20 % 5-годинного вікна твого Claude.",
    "The rules every model call of every participant gets, new ones included (Claude or OpenRouter): the general part + the section of its pass. Opus learns from real results and rewrites them, so Sonnet and Haiku add material well. One learning session uses at most 20 % of your Claude 5-hour window."],

/* ---------- textures: procedural, made in the browser (nothing is downloaded) and never tiled ----------
   A hidden mask decides only how strong the grain is at each point: for the page a softened Voronoi mixed with soft
   clouds, for paper and ink clouds plus long thin fibres. The grain is zero-mean around the base colour and does not
   clip, so the mask itself stays invisible: only the noise breathes with it. Drawn straight into canvases (no image
   encoding). A WebGL version was tried on 2026-10-26 and was slower here (context + shader compile ~260 ms against
   ~150 ms for all three textures on the CPU), so the CPU does it. */
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s ^= s << 13, s ^= s >>> 17, s ^= s << 5) >>> 0) / 4294967296; }
function paperField(w, h, r) {
  // [cell width, cell height, weight]: big blotches, medium clouds, long thin horizontal fibres
  const scales = [[260, 260, 1], [90, 90, .6], [70, 3, .45], [18, 18, .25]], out = new Float32Array(w * h);
  let total = 0;
  for (const [sx, sy, wt] of scales) {
    const gw = Math.ceil(w / sx) + 2, gh = Math.ceil(h / sy) + 2, gr = new Float32Array(gw * gh);
    for (let i = 0; i < gr.length; i++) gr[i] = r();
    for (let y = 0; y < h; y++) {
      const fy = y / sy, iy = fy | 0, ty = fy - iy, vy = ty * ty * (3 - 2 * ty), row = y * w;
      for (let x = 0; x < w; x++) {
        const fx = x / sx, ix = fx | 0, tx = fx - ix, vx = tx * tx * (3 - 2 * tx), k = iy * gw + ix;
        const a = gr[k] + (gr[k + 1] - gr[k]) * vx, c = gr[k + gw] + (gr[k + gw + 1] - gr[k + gw]) * vx;
        out[row + x] += (a + (c - a) * vy) * wt;
      }
    }
    total += wt;
  }
  let lo = 1, hi = 0;
  for (let i = 0; i < out.length; i++) { out[i] /= total; if (out[i] < lo) lo = out[i]; if (out[i] > hi) hi = out[i]; }
  const span = hi - lo || 1;
  for (let i = 0; i < out.length; i++) out[i] = (out[i] - lo) / span;
  return out;
}
// softened Voronoi: a smooth minimum of the distances to jittered points (no hard cell edges), 0..1
function voronoiField(w, h, cell, r) {
  const gw = Math.ceil(w / cell) + 3, gh = Math.ceil(h / cell) + 3, px = new Float32Array(gw * gh), py = new Float32Array(gw * gh);
  for (let i = 0; i < px.length; i++) { px[i] = r(); py[i] = r(); }
  const out = new Float32Array(w * h), K = 6;            // K: how soft the borders are (lower = softer)
  let lo = Infinity, hi = -Infinity;
  for (let y = 0; y < h; y++) {
    const gy = y / cell, cy = gy | 0;
    for (let x = 0; x < w; x++) {
      const gx = x / cell, cx = gx | 0;
      let acc = 0;
      for (let j = 0; j <= 2; j++) for (let i = 0; i <= 2; i++) {
        const k = (cy + j) * gw + cx + i, dx = cx + i - 1 + px[k] - gx, dy = cy + j - 1 + py[k] - gy;
        acc += Math.exp(-K * Math.sqrt(dx * dx + dy * dy));
      }
      const v = -Math.log(acc) / K;
      out[y * w + x] = v; if (v < lo) lo = v; if (v > hi) hi = v;
    }
  }
  const span = hi - lo || 1;
  for (let i = 0; i < out.length; i++) out[i] = (out[i] - lo) / span;

}

function voronoiMix(w, h, r) {

// A phone photo is 4-8 MB; the server shrinks pages to 1800 px anyway, so send them at 2400 px (Cloudflare caps a request at 100 MB)
async function shrinkImage(f) {
  if (!f.type.startsWith("image/") || /\.hei[cf]$/i.test(f.name) || f.size < 700 * 1024) return f;
  try {
    const bmp = await createImageBitmap(f, {imageOrientation: "from-image"});
    const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.88));
    if (!blob || blob.size >= f.size) return f;
    return new File([blob], f.name.replace(/\.[^.]+$/, "") + ".jpg", {type: "image/jpeg"});
  } catch (e) { return f; }
}

$("#send").onclick = async () => {
  const kind = uploadKind(), msg0 = $("#sendMsg");
  if (kind !== "reference" && !$("#udate").value) { msg0.textContent = t("add.needDate"); msg0.className = "msg bad"; return; }
  if (kind === "asis") {
    const bad = !$("#subject").value ? t("add.needSubject") : picked.some(f => !/\.pdf$/i.test(f.name)) ? t("add.pdfOnly") :
      ($("#utopic").value === "__new" && !$("#utopicNew").value.trim()) ? t("add.needTopic") : "";
    if (bad) { msg0.textContent = bad; msg0.className = "msg bad"; return; }
  }
  let files = picked;
  if (S?.public) {
    $("#send").disabled = true;
    files = await Promise.all(picked.map(shrinkImage));
    const cfg = await authConfig(), total = files.reduce((a, f) => a + f.size, 0);
    if (cfg.max_upload && total > cfg.max_upload) {
      msg0.textContent = t("add.tooBig", Math.floor(cfg.max_upload / 1048576)); msg0.className = "msg bad";
      $("#send").disabled = false; return;
    }
  }
  const fd = new FormData();
  files.forEach(f => fd.append("files", f, f.name));
  fd.append("note", $("#note").value);
  fd.append("subject", $("#subject").value);
  fd.append("kind", kind);
  if (kind === "notes" && $("#pcode").value.trim()) fd.append("code", $("#pcode").value);
  if (kind !== "reference") fd.append("date", $("#udate").value);
  if (kind === "asis") {
    const tp = $("#utopic").value;
    if (tp === "__new") fd.append("topic_title", $("#utopicNew").value.trim()); else fd.append("topic", tp);
  }
  const xhr = new XMLHttpRequest(), bar = $("#bar"), msg = $("#sendMsg");
  xhr.open("POST", "/api/upload");
  xhr.setRequestHeader("X-Lang", LANG);
  bar.style.display = "block"; msg.textContent = ""; msg.className = "msg"; $("#send").disabled = true;
  xhr.upload.onprogress = e => { if (e.lengthComputable) bar.firstElementChild.style.width = (100 * e.loaded / e.total) + "%"; };
  xhr.onload = () => {
    bar.style.display = "none"; bar.firstElementChild.style.width = 0;
    if (xhr.status === 401) { $("#send").disabled = false; openAuth(); return; }
    if (xhr.status === 200) {
      let j = {}; try { j = JSON.parse(xhr.responseText); } catch (e) {}
      msg.textContent = t("add.sent") + (j.interactive ? " " + t("add.iqueued", j.interactive) : "") +
        (j.skipped?.length ? " " + t("add.dupes", j.skipped.join(", ")) : "") +
        (j.skipped_by?.length ? " " + t("add.dupesBy", [...new Set(j.skipped_by.map(x => x.by))].join(", ")) : "");
      msg.className = "msg ok"; picked = []; $("#note").value = ""; $("#pcode").value = ""; $("#udate").value = today(); renderFiles(); refresh();
    } else {
      let d = xhr.responseText || xhr.status; try { d = JSON.parse(xhr.responseText).detail || d; } catch (e) {}
      msg.textContent = t("add.error", d); msg.className = "msg bad"; $("#send").disabled = false;
    }
  };
  xhr.onerror = () => { bar.style.display = "none"; msg.textContent = t("add.noConn"); msg.className = "msg bad"; $("#send").disabled = false; };
  xhr.send(fd);
};

/* ---------- updating the page without disturbing the person ---------- */
// The status refresh runs every 5 s: touch the DOM only where something really changed,
// never rebuild a select that is in use, and keep <details> open/closed as the person left them.
function setHTML(el, html) {
  if (el._html === html) return;
  if (el.contains(document.activeElement) && document.activeElement.matches("input, select, textarea")) return;  // next tick
  const open = {};
  el.querySelectorAll("details[data-k]").forEach(d => open[d.dataset.k] = d.open);
  el.innerHTML = html; el._html = html;
  el.querySelectorAll("details[data-k]").forEach(d => { if (d.dataset.k in open) d.open = open[d.dataset.k]; });
}
function setOptions(sel, html) {
  if (sel._html === html || document.activeElement === sel) return;
  const v = sel.value;
  sel.innerHTML = html; sel._html = html;
  if ([...sel.options].some(o => o.value === v)) sel.value = v;
}
function setText(el, text, cls) {
  if (el.textContent !== text) el.textContent = text;
  if (cls !== undefined && el.className !== cls) el.className = cls;
}

// usage bar under the engine button: plan limits Claude Code last reported, or the free OpenRouter requests used today
function renderUsage() {
  const u = S.usage || {}, box = $("#usage");
  const when = ts => {
    const d = new Date(ts * 1000), soon = ts * 1000 - Date.now() < 20 * 3600 * 1000;
    return d.toLocaleString(loc(), soon ? {hour: "2-digit", minute: "2-digit"} : {weekday: "short", hour: "2-digit", minute: "2-digit"});
  };
  const row = (label, frac, text, cls, tip) => `<span title="${esc(tip)}">${esc(label)}</span>` +
    (frac == null ? `<span></span>` : `<span class="t ${cls}" title="${esc(tip)}"><b style="width:${Math.round(frac * 100)}%"></b></span>`) +
    `<span class="${cls === "x" ? "x p" : ""}" title="${esc(tip)}">${esc(text)}</span>`;
  let html = "";
  if (u.engine === "claude") {
    html = (u.limits || []).map(l => {
      const key = "usage.type." + l.type, label = T.uk[key] ? t(key) : l.type, rej = l.status === "rejected";
      const tip = [l.resets ? t("usage.resets", when(l.resets)) : "", l.seen ? t("usage.seen", fmt(l.seen)) : "", t("usage.tip")].filter(Boolean).join(" · ");
      const frac = rej ? 1 : l.util, cls = rej || frac >= 0.95 ? "x" : frac >= 0.75 ? "w" : "";
      const text = rej ? t("usage.rejected") : frac != null ? Math.round(frac * 100) + "%" : t("usage.ok");
      return row(label, frac, text, cls, tip) + (l.resets && (rej || frac >= 0.75) ? `<span class="note">${esc(t("usage.resets", when(l.resets)))}</span>` : "");
    }).join("") || `<span class="note" title="${esc(t("usage.tip"))}">${esc(t("usage.none"))}</span>`;
  } else if (u.auto) {
    const frac = u.cap ? Math.min(1, u.used / u.cap) : null, cls = frac >= 0.95 ? "x" : frac >= 0.75 ? "w" : "";
    html = `<span class="note">${esc(t("usage.orToday"))}${u.paid ? " · " + esc(t("usage.orPaid")) : ""}</span>` +
      row("", frac, u.cap ? `${u.used}/${u.cap}` : String(u.used), cls, t(u.paid ? "free.paid" : u.paid === false ? "free.unpaid" : "usage.orToday")) +
      (u.until ? `<span class="note x l">${esc(t("usage.orPaused", when(u.until)))}</span>` : "");
  }
  setHTML(box, html);
}

// what exactly is being done to one queue item now: chunk i of n, its pages and files, the pass, model and step
function progHTML(p) {
  if (!p) return "";
  const mins = iso => iso ? Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)) : null;
  const key = "prog.pass." + p.pass, pass = p.pass ? (T.uk[key] ? t(key) : p.pass) : t("prog.start");
  const head = [];
  if (p.chunk && p.chunks) head.push(t("prog.chunk", p.chunk, p.chunks, p.pages || "?"));
  else if (p.total_pages) head.push(t("prog.pages", p.total_pages));
  const line2 = [pass];
  if (p.model) line2.push(t("prog.model", p.model));
  if (p.turn) line2.push(t("prog.turn", p.turn));
  const m = mins(p.pass_since || p.since);
  if (m != null) line2.push(t("prog.for", m));
  const frac = p.chunks ? Math.min(1, (p.done || 0) / p.chunks) : null;
  return `<div class="prog" role="status">${head.length ? esc(head.join(" · ")) + "<br>" : ""}<span class="act"><i aria-hidden="true"></i>${esc(line2.join(" · "))}</span>${
    frac != null ? `<div class="pb" title="${esc(t("prog.done", p.done || 0, p.chunks))}"><i style="width:${Math.round(frac * 100)}%"></i></div><span class="pf">${esc(t("prog.done", p.done || 0, p.chunks))}</span>` : ""}${
    p.files?.length ? `<br><span class="pf">${esc(t("prog.files") + p.files.join(", "))}</span>` : ""}${
    p.group ? `<br><span class="pf">${esc(t("prog.group"))}</span>` : ""}</div>`;
}

/* ---------- interactive pages: a glass button to open, a request to change ---------- */
const IPE = {};         // pages with the change box open -> the text typed so far (a status refresh redraws the list)
const ipKey = (subj, stem) => subj + "/" + stem;
/* the glass flows while the pointer (or the keyboard focus) is on it; on leaving, the loop is not cut but run on to its end */
const GLASS_MS = 3600;
function glassIn(el) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !el.animate) return;
  let a = el._ga;
  if (a) { a.playbackRate = 1; a.effect.updateTiming({iterations: Infinity}); return; }
  const cs = getComputedStyle(el), b0 = cs.getPropertyValue("--b0").trim() || "85%", p0 = parseFloat(cs.getPropertyValue("--p0")) || 0, e = "ease-in-out";
  try {
    a = el.animate([{offset: 0, "--b": b0, "--q": b0, "--p": p0 + "px", easing: e}, {offset: .33, "--b": "8%", "--q": "92%", "--p": p0 + 6 + "px", easing: e},
      {offset: .66, "--b": "92%", "--q": "8%", "--p": p0 + 12 + "px", easing: e}, {offset: 1, "--b": b0, "--q": b0, "--p": p0 + "px"}],
      {duration: GLASS_MS, iterations: Infinity});
  } catch (err) { return; }
  a.onfinish = a.oncancel = () => { if (el._ga === a) el._ga = null; };
  el._ga = a;
}
function glassOut(el) {
  const a = el._ga;
  if (!a) return;
  a.effect.updateTiming({iterations: Math.floor((a.currentTime || 0) / GLASS_MS) + 1});     // finish the round that is running
  a.playbackRate = 2;
}
addEventListener("mouseover", e => { const g = e.target.closest?.(".gbtn"); if (g) glassIn(g); });
addEventListener("mouseout", e => { const g = e.target.closest?.(".gbtn"); if (g && !g.contains(e.relatedTarget)) glassOut(g); });
addEventListener("focusin", e => { const g = e.target.closest?.(".gbtn"); if (g) glassIn(g); });
addEventListener("focusout", e => { const g = e.target.closest?.(".gbtn"); if (g && !g.contains(e.relatedTarget)) glassOut(g); });
function ipVar(stem) {            // the glass of each button differs: numbers from its name
  let h = 7;
  for (const ch of stem) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const f = (sh, m) => ((h >>> sh) % m) / m;
  return `--p0:${(f(0, 97) * 9).toFixed(1)}px;--r:${(.8 + f(7, 89) * .75).toFixed(2)};--b0:${Math.round(40 + f(13, 83) * 20)}%;--dir:${(h >>> 5) & 1 ? "270deg" : "90deg"}`;
}
function ipageRow(subj, i) {
  const k = ipKey(subj, i.stem), open = k in IPE && !S.anon, can = true;
  const q = `'${esc(subj)}','${esc(i.stem)}'`;
  return `<li class="ipg"><span class="gbtn" style="${ipVar(i.stem)}"><b class="gring" aria-hidden="true"></b><a class="glass" href="${i.url}" target="_blank"><span><i title="${esc(i.title)}">${esc(i.title)}</i></span></a><button class="gedit" type="button" aria-expanded="${open}" onclick="ipageToggle(${q})"><span>${esc(t("ipg.edit"))}</span></button></span>
    ${can && i.mine && i.can_undo ? `<span class="ipb"><button class="btn small" type="button" onclick="ipageUndo(${q})">${esc(t("ipg.undo"))}</button></span>` : ""}
    ${can && open ? `<div class="ipe">${i.mine ? "" : `<p class="muted small" style="margin:0 0 6px">${esc(t("ipg.copyNote"))}</p>`}<textarea maxlength="2000" placeholder="${esc(t("ipg.ph"))}" oninput="IPE['${esc(k)}'] = this.value">${esc(IPE[k])}</textarea>
      <div class="row"><button class="btn small primary" type="button" onclick="ipageSend(this, ${q})">${esc(t("ipg.send"))}</button>
      <button class="btn small" type="button" onclick="ipageToggle(${q})">${esc(t("ipg.cancel"))}</button><span class="msg" role="status"></span></div></div>` : ""}</li>`;
}
function ipageToggle(subj, stem) {
  if (S?.anon) { openAuth(); return; }                  // a reader without an account signs in first
  const k = ipKey(subj, stem);

async function ipageSend(b, subj, stem) {
  const k = ipKey(subj, stem), box = b.closest(".ipe"), msg = box.querySelector(".msg"), text = (IPE[k] || "").trim();
  if (!text) { msg.textContent = t("req.empty"); msg.className = "msg bad"; return; }

const TAG = {queued: "wait", accepted: "ok", partial: "ok", rejected: "bad", failed: "bad", undone: ""};
$("#ssubject").onchange = fillSugTargets;
$("#stext").oninput = () => { $("#scount").textContent = `${$("#stext").value.length} / 1500`; };
function fillSugTargets() {
  const s = S?.subjects.find(x => x.id === $("#ssubject").value), groups = {};
  (s?.targets || []).forEach(tg => (groups[tg.group] ||= []).push(tg));
  const val = tg => tg.type === "entry" ? `e|${tg.topic}|${tg.entry}` : `i|${tg.stem}`;
  setOptions($("#starget"), Object.keys(groups).length
    ? Object.entries(groups).map(([g, l]) => `<optgroup label="${esc(g)}">${l.map(tg => `<option value="${esc(val(tg))}">${esc(tg.title)}</option>`).join("")}</optgroup>`).join("")
    : `<option value="">${esc(t("sug.noPages"))}</option>`);
}
function renderSuggest() {
  setOptions($("#ssubject"), S.subjects.map(s => `<option value="${esc(s.id)}">${esc(s.title)}</option>`).join(""));
  fillSugTargets();
  $("#shareRow").hidden = !!S.is_admin;
  const lim = S.suggest_limits || {};
  setText($("#slimit"), lim.wait > 0 ? t("sug.wait", lim.why, lim.wait < 90 ? lim.wait + " " + t("unit.s") : Math.ceil(lim.wait / 60) + " " + t("unit.min"))
    : t("sug.today", lim.used_day || 0, lim.max_day || 5));
  $("#ssend").disabled = lim.wait > 0;

// drawing without putting back, like at an exam; when the pile is empty it is shuffled again
function drawTicket(sid, id) {
  const e = S.subjects.find(x => x.id === sid)?.exams.find(x => x.id === id);
  if (!e) return;
  let got = exDrawn[id] || [];
  if (got.length >= e.tickets) got = [];
  const pile = Array.from({length: e.tickets}, (_, i) => i + 1).filter(n => !got.includes(n));
  const n = pile[Math.floor(Math.random() * pile.length)];
  exDrawn[id] = got.concat(n); exLast[id] = n; saveDrawn();
  renderExams();
}
function resetDraw(sid, id) { delete exDrawn[id]; delete exLast[id]; saveDrawn(); renderExams(); }

  const r = await fetch("/api/exam/delete", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({subject, id})});
  const msg = $("#exmsg");
  if (r.ok) { delete exDrawn[id]; delete exLast[id]; saveDrawn(); msg.textContent = t("ex.deleted"); msg.className = "msg ok"; }
  else { let d; try { d = (await r.json()).detail; } catch (e) { d = r.status; } msg.textContent = t("add.error", d); msg.className = "msg bad"; }
  refresh();
}

function solvePow(ch) {
  return new Promise((res, rej) => {
    const src = `onmessage = async e => { const {salt, bits} = e.data, enc = new TextEncoder();
      for (let base = 0; ; base += 256) {

      } };`;
    const w = new Worker(URL.createObjectURL(new Blob([src], {type: "text/javascript"})));
    w.onmessage = e => { w.terminate(); res(e.data); };
    w.onerror = e => { w.terminate(); rej(e); };
    w.postMessage({salt: ch.salt, bits: ch.bits});
  });
}
async function humanProof() {
  const cfg = await authConfig();
  if (cfg.turnstile) {
    const tok = tsId !== null ? turnstile.getResponse(tsId) : "";
    if (!tok) throw new Error("needHuman");
    return {turnstile: tok};
  }
  if (!window.crypto?.subtle) throw new Error("noCrypto");
  const ch = await (await fetch("/api/auth/challenge")).json();
  if (!ch.salt) throw new Error(ch.detail || "challenge");
  return {pow: {salt: ch.salt, bits: ch.bits, exp: ch.exp, sig: ch.sig, n: await solvePow(ch)}};
}
function applyAuthMode() {
  const reg = authMode() === "register";
  $("#apBox").hidden = $("#auHint").hidden = !reg;
  $("#ap").autocomplete = reg ? "new-password" : "current-password";
  setText($("#aGo"), t(reg ? "auth.goRegister" : "auth.goLogin"));
}
document.querySelectorAll("input[name=am]").forEach(r => r.onchange = applyAuthMode);
function openAuth() {
  if ($("#auth").open) return;
  const anon = !!(S && S.anon);                         // a reader can dismiss it; with no book behind it, nobody can
  $("#aX").hidden = $("#aWhy").hidden = !anon;
  $("#auth").showModal(); applyAuthMode(); mountTurnstile();
}
$("#loginBtn").onclick = openAuth;
$("#auth").addEventListener("cancel", e => { if (!(S && S.anon)) e.preventDefault(); });
$("#aForm").onsubmit = async ev => {
  ev.preventDefault();
  const mode = authMode(), user = $("#au").value.trim().toLowerCase(), pw = $("#ap").value, msg = $("#aMsg"), go = $("#aGo");
  const fail = text => { msg.textContent = text; msg.className = "msg bad"; };
  msg.textContent = "";
  if (!user || !pw) return fail(t("auth.fill"));
  if (mode === "register" && pw !== $("#ap2").value) return fail(t("auth.mismatch"));
  go.disabled = true; setText($("#aState"), t("auth.checking"));
  try {
    const r = await fetch("/api/auth/" + mode, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: user, password: pw, ...(await humanProof())})});
    if (r.ok) { $("#ap").value = $("#ap2").value = ""; $("#auth").close(); refresh(); }
    else { let d; try { d = (await r.json()).detail; } catch (e) { d = r.status; } fail(typeof d === "string" ? d : t("common.failed")); }
  } catch (e) {
    fail(e.message === "needHuman" ? t("auth.needHuman") : e.message === "noCrypto" ? t("auth.noCrypto") : t("auth.noConn"));
  }
  if (tsId !== null) try { turnstile.reset(tsId); } catch (e) {}
  go.disabled = false; setText($("#aState"), "");
};
$("#logoutBtn").onclick = async () => {
  await fetch("/api/auth/logout", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
  location.reload();
};
$("#pwGo").onclick = async () => {
  const msg = $("#pwMsg");
  const r = await fetch("/api/auth/password", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({old: $("#pwOld").value, new: $("#pwNew").value})});
  if (r.ok) { msg.textContent = t("me.pwDone"); msg.className = "msg ok"; $("#pwOld").value = $("#pwNew").value = ""; }
  else { let d; try { d = (await r.json()).detail; } catch (e) { d = r.status; } msg.textContent = typeof d === "string" ? d : t("common.failed"); msg.className = "msg bad"; }
};

async function refresh() {
  try {
    const r = await fetch("/api/status");
    if (r.status === 401) { S = null; openAuth(); return; }       // the public side: not signed in
    S = await r.json();
    if ($("#auth").open && !S.anon) $("#auth").close();
    render();
    if (S.anon && !window._anonTab) { window._anonTab = true; document.querySelector("nav button[data-tab=books]").click(); }
    if (S.is_admin) {
      await loadAdmin(); await loadAccounts();
      if (!SV || $("#tab-admin").classList.contains("on")) await loadSupervisor();
      if (!SK || ($("#tab-admin").classList.contains("on") && Date.now() - (window._skT || 0) > 30000)) { window._skT = Date.now(); await loadSkill(); }
    }
  }
  catch (e) { $("#worker").textContent = t("pill.down"); $("#worker").className = "pill bad"; }
}
applyStatic();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
</script>
